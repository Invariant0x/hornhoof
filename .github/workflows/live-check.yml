name: Live check

# Publishes the proof that a real node of one exact build ran Claude, Codex, Kimi and Antigravity, next to the images it speaks
# of: see "Releasing a version" in CONTRIBUTING.md. The proof is one small image with the proof in its label, under a tag of its
# own, which servers and the publish job read the way they read any build. Whoever may publish images may publish this.
on:
  workflow_dispatch:
    inputs:
      proof:
        description: The proof, as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # What counts as a proof is decided by main's copy of the door, not by a branch's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Through the environment: the words of a proof are data, never part of a command.
      PROOF: ${{ inputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Build the door
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build -w @hornhoof/protocol
          npm run build -w @hornhoof/server
      - id: judged
        name: Refuse a proof that does not speak of exactly the images of its commit
        run: |
          mkdir "$RUNNER_TEMP/proof"
          printf '%s' "$PROOF" > "$RUNNER_TEMP/proof/proof.json"
          commit=$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/proof/proof.json")
          node apps/server/dist/live-check-gate.js --commit "$commit" --proof "$RUNNER_TEMP/proof/proof.json"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish it next to the images
        env:
          COMMIT: ${{ steps.judged.outputs.commit }}
        run: |
          cd "$RUNNER_TEMP/proof"
          printf 'FROM scratch\nCOPY proof.json /proof.json\n' > Dockerfile
          docker buildx build --provenance=false --sbom=false --push --label "io.hornhoof.live-check=$(cat proof.json)" --tag "ghcr.io/invariant0x/hornhoof:live-check-$COMMIT" .
