name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n scripts/install.sh
      - run: shellcheck scripts/install.sh

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: hornhoof
            file: Dockerfile
          - name: hornhoof-node
            file: apps/node/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # The product version, the commit's title and how many database migrations the build carries.
      - id: build
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --format=%s | tr -d '\r"')" >> "$GITHUB_OUTPUT"
          echo "migrations=$(ls apps/server/drizzle/*.sql | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The source label links each package to this repository on GitHub; the rest tell Hornhoof what a build is.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.hornhoof.title=${{ steps.build.outputs.title }}
            io.hornhoof.migrations=${{ steps.build.outputs.migrations }}
          build-args: |
            HORNHOOF_VERSION=${{ steps.build.outputs.version }}
            HORNHOOF_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/invariant0x/${{ matrix.name }}:latest
            ghcr.io/invariant0x/${{ matrix.name }}:${{ steps.build.outputs.version }}
            ghcr.io/invariant0x/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
