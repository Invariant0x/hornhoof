name: Images

on:
  push:
    branches: [main]
    # A push that changes only texts and pictures builds no new images, so no update is offered for it.
    paths-ignore:
      - 'README.md'
      - 'EXAMPLES.md'
      - 'guide/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.github/assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  # Pull requests run the tests only. Images are built by hand, from any branch, under the tag of their commit alone: a real
  # node of those images then goes through the live check of guide/updates.md. A push to main builds nothing: it moves the
  # tags every machine reads onto exactly the images the check speaks of, or stops.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A full test run in Hornhoof leaves the status hornhoof/tests on the commit it checked. With a success there, or on the
  # second parent of a merge with the same tree, GitHub need not run the tests again; whatever it cannot tell, they run.
  mark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      proved: ${{ steps.mark.outputs.proved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its parents: a merge may take the mark of its second parent.
          fetch-depth: 2
      - id: mark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tests-mark.mjs

  # The tests run on GitHub's machines in four parts at once, two workers in each: on one machine with two processors,
  # which GitHub gives a private repository, the suite took half an hour.
  test:
    needs: mark
    # A first job that failed leaves no answer, so the tests run.
    if: ${{ !cancelled() && needs.mark.outputs.proved != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      PART: ${{ matrix.part }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: install
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build -w @hornhoof/protocol
      # What npm test runs besides the three apps' suites, with the lint and the scripts' checks: once, in the first part.
      # Every check runs even when one before it failed, so one run shows all that is wrong.
      - name: Lint, release checks, protocol and scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 1 }}
        env:
          # The limit node sets by itself on a machine with less than 15 GB of memory: what outgrows it fails here too.
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          npm run lint
          npm run typecheck:tests
          node scripts/check-release.mjs --local
          npm run test:release
          npm test -w @hornhoof/protocol
          bash -n scripts/install.sh
          shellcheck scripts/install.sh scripts/node-build.sh
      - name: Server
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/server
        run: npx vitest run --shard="$PART" --maxWorkers=2
      - name: Node
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/node
        run: npx vitest run --shard="$PART" --maxWorkers=2
      - name: Web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: npx vitest run --shard="$PART" --maxWorkers=2

  images:
    needs: [mark, test]
    # Skipped tests would skip this job too, unless it says what they may be: passed, or left out because the mark proved the commit.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.mark.outputs.proved == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: hornhoof
            file: Dockerfile
          - name: hornhoof-node
            file: apps/node/Dockerfile
          - name: hornhoof-updater
            file: apps/updater/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The product version, the commit's title, how many database migrations the build carries, and the node build:
      # the last commit that changed the node image's files, which needs the whole history checked out above.
      - id: build
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --format=%s | tr -d '\r"')" >> "$GITHUB_OUTPUT"
          echo "migrations=$(ls apps/server/drizzle/*.sql | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          node=$(bash scripts/node-build.sh)
          echo "node=$node" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          # The node image goes out through its own output, so the push and the timestamps it rewrites are one export.
          push: ${{ matrix.name != 'hornhoof-node' }}
          # The source label links each package to this repository on GitHub; the rest tell Hornhoof what a build is.
          # The node image carries none of a commit's own labels, timestamps or provenance, so its digest changes only
          # when its own layers change.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            ${{ matrix.name != 'hornhoof-node' && format('org.opencontainers.image.version={0}', steps.build.outputs.version) || '' }}
            ${{ matrix.name != 'hornhoof-node' && format('org.opencontainers.image.revision={0}', github.sha) || '' }}
            ${{ matrix.name != 'hornhoof-node' && format('io.hornhoof.title={0}', steps.build.outputs.title) || '' }}
            ${{ matrix.name != 'hornhoof-node' && format('io.hornhoof.migrations={0}', steps.build.outputs.migrations) || '' }}
          build-args: |
            ${{ matrix.name == 'hornhoof' && format('HORNHOOF_VERSION={0}', steps.build.outputs.version) || '' }}
            ${{ matrix.name == 'hornhoof' && format('HORNHOOF_COMMIT={0}', github.sha) || '' }}
            ${{ matrix.name != 'hornhoof-updater' && format('HORNHOOF_NODE_BUILD={0}', steps.build.outputs.node) || '' }}
            ${{ matrix.name == 'hornhoof-node' && 'SOURCE_DATE_EPOCH=315532800' || '' }}
          outputs: ${{ matrix.name == 'hornhoof-node' && 'type=registry,rewrite-timestamp=true' || '' }}
          provenance: ${{ matrix.name != 'hornhoof-node' }}
          # Every company updates to latest, so this job never moves it: the publish job does, after the live check.
          tags: ghcr.io/invariant0x/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The one way a build reaches machines. It takes the images the live check ran on, as they are: a build made again would
  # have other digests. A commit without its check stops here, the tags stay where they are, and running this job again
  # once the check is published goes on. A merge commit is another commit: main takes a checked commit by fast-forward.
  publish:
    needs: [mark, test]
    # Tests the mark left out count as passed here too.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.mark.outputs.proved == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Build the door
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build -w @hornhoof/protocol
          npm run build -w @hornhoof/server
      - id: checked
        name: Ask for the live check of this exact build
        run: node apps/server/dist/live-check-gate.js --commit "$GITHUB_SHA" --outputs "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the version and latest onto exactly those images
        env:
          APP: ${{ steps.checked.outputs.app }}
          NODE: ${{ steps.checked.outputs.node }}
          UPDATER: ${{ steps.checked.outputs.updater }}
        run: |
          version=$(node -p "require('./package.json').version")
          move() { docker buildx imagetools create --tag "ghcr.io/invariant0x/$1:latest" --tag "ghcr.io/invariant0x/$1:$version" "ghcr.io/invariant0x/$1@$2"; }
          # Servers read the app image first, so it moves once what it goes with is there.
          move hornhoof-updater "$UPDATER"
          move hornhoof-node "$NODE"
          move hornhoof "$APP"
      - name: Check that latest holds exactly those images
        run: node apps/server/dist/live-check-gate.js --commit "$GITHUB_SHA" --tag latest

  release:
    needs: publish
    # Tests skipped further back would skip this job too, so it asks only that the images went out.
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create the version tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "$tag already exists; no new release."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Hornhoof $version" --notes-file "$RUNNER_TEMP/release-notes.md"
