name: Images

on:
  push:
    branches: [main]
    # A push that changes only texts and pictures builds no new images, so no update is offered for it.
    paths-ignore:
      - 'README.md'
      - 'EXAMPLES.md'
      - 'guide/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.github/assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  # Pull requests run the tests only. A push to main of a new version builds its images under the tag of its commit, then
  # moves the tags every machine reads onto exactly those images, or stops: a release needs nobody to start a build. A run by
  # hand builds the images of any branch under the tag of its commit alone and moves nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each branch, so two pushes to main never build or move the images of one version at once. A run
# waits for the one before it rather than cancelling it.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A passed test run leaves the status hornhoof/tests on the commit it checked: Hornhoof's own, or GitHub's through the
  # passed job below. With a success there, or on the second parent of a merge with the same tree, GitHub need not run
  # the tests again; whatever it cannot tell, they run.
  # Without one, this job chooses the tests, as an author's check does (.hornhoof/author-check.md): those the change since
  # the nearest commit whose tests passed reaches. A change the selector cannot tell, or one that reaches every suite whole,
  # runs the whole suite, and so does a choice that fails.
  # A private repository can choose its runners with TESTS_RUNS_ON. Public repositories and fork pull requests use
  # GitHub's machines. A fork can change its workflow, so public repositories also need to detach their own runners.
  # Fork pull requests run the full suite without the job that reads commit statuses.
  mark:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TESTS_RUNS_ON && fromJSON(vars.TESTS_RUNS_ON) || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: read
    outputs:
      proved: ${{ steps.mark.outputs.proved }}
      parts: ${{ steps.select.outputs.parts }}
      selection: ${{ steps.select.outputs.selection }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a merge may take the mark of its second parent, and the tests are chosen against a commit
          # further back.
          fetch-depth: 0
          persist-credentials: false
      - id: mark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tests-mark.mjs
      - if: ${{ steps.mark.outputs.proved != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The selector reads the node's build and, through Vitest, the import graph.
      - id: prepare
        if: ${{ steps.mark.outputs.proved != 'true' }}
        continue-on-error: true
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build -w @hornhoof/protocol
          npm run build -w @hornhoof/node
      - id: select
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tests-select.mjs

  # The whole suite runs in four parts at once, two workers in each: on one machine with two processors, which GitHub gives
  # a private repository, it took half an hour. The tests the first job chose run in as many parts as they fill, up to four.
  # TESTS_RUNS_ON above decides whose machines.
  test:
    needs: mark
    # A first job that failed leaves no answer, so the whole suite runs.
    if: ${{ !cancelled() && needs.mark.outputs.proved != 'true' }}
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TESTS_RUNS_ON && fromJSON(vars.TESTS_RUNS_ON) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.mark.outputs.parts || '[1, 2, 3, 4]') }}
    env:
      PART: ${{ matrix.part }}/4
      # The tests the first job chose; empty for the whole suite.
      SELECTION: ${{ needs.mark.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: install
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build -w @hornhoof/protocol
      # What npm test runs besides the suites, once, in the first part: the lint, of the files the change left when the
      # tests were chosen, the types and the release checks. Every step runs even when one before it failed, so one run
      # shows all that is wrong.
      - name: Lint and release checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 1 }}
        env:
          # Twice the 2048 MB node sets by itself on a machine with less than 15 GB of memory, for the lint: it reads the
          # server's types with its tests through TypeScript 5.9 in node, which took about 2.09 GB and ran out at 2048. tsc is
          # TypeScript 7 and runs outside node.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node scripts/tests-select.mjs --lint
          npm run typecheck:tests
          node scripts/check-release.mjs --local
          bash -n scripts/install.sh
          shellcheck scripts/install.sh scripts/node-build.sh
      - name: Scripts and protocol
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 1 && !env.SELECTION }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run test:release
          npm test -w @hornhoof/protocol
      - name: Server
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !env.SELECTION }}
        working-directory: apps/server
        run: npx vitest run --shard="$PART" --maxWorkers=2
      - name: Node
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !env.SELECTION }}
        working-directory: apps/node
        run: npm test -- --shard="$PART" --maxWorkers=2
      - name: Web
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !env.SELECTION }}
        working-directory: apps/web
        run: npx vitest run --shard="$PART" --maxWorkers=2
      # Each suite with the files of this part, as a node runs them.
      - name: The tests the change reaches
        if: ${{ !cancelled() && steps.install.outcome == 'success' && env.SELECTION }}
        env:
          NUMBER: ${{ matrix.part }}
        run: |
          npm run build -w @hornhoof/node
          node scripts/tests-select.mjs --run "$NUMBER"

  # Every part passed: the commit gets the mark, so the push to main that takes a commit built by hand, or any other run
  # of it, skips the tests. Tests the change chose prove the commit as the whole suite does, as they stood on a commit whose
  # tests passed: the mark names that commit. A pull request leaves none.
  passed:
    needs: [mark, test]
    if: ${{ needs.test.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TESTS_RUNS_ON && fromJSON(vars.TESTS_RUNS_ON) || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS_SINCE: ${{ needs.mark.outputs.base }}
        run: node scripts/tests-mark.mjs --leave

  # The tests against real Postgres and against Pebble, Let's Encrypt's test CA, start their servers in Docker and stay
  # out of the suite above. Our own test runners have no Docker daemon, so this job runs only where the repository
  # variable REAL_RUNS_ON names a runner that has one, and is left out while it names none: until then
  # `npm run test:real` is run by hand before a merge, and its result is named in the pull request. A pull request from a
  # fork runs it on GitHub's machines, which have Docker.
  test-real:
    if: ${{ vars.REAL_RUNS_ON != '' }}
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.REAL_RUNS_ON && fromJSON(vars.REAL_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The tests of copies run pairs of Postgres on both processors, each beside the other.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,amd64
      - run: npm run test:real

  images:
    needs: [mark, test]
    # Skipped tests would skip this job too, unless it says what they may be: passed, or left out because the mark proved the commit.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.mark.outputs.proved == 'true')) }}
    # Private repositories may set BUILD_RUNS_ON and BUILDKIT_ENDPOINT. Public repositories build on GitHub.
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.BUILD_RUNS_ON && fromJSON(vars.BUILD_RUNS_ON) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: hornhoof
            file: Dockerfile
          - name: hornhoof-node
            file: apps/node/Dockerfile
          - name: hornhoof-updater
            file: apps/updater/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Most pushes to main carry no new version: one whose version is out already builds nothing. A run by hand builds.
      - id: fresh
        name: Look whether this version is out already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$EVENT" = push ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2> /dev/null; then
            echo "Version $version is out already, so this push builds no images."
            echo "version=out" >> "$GITHUB_OUTPUT"
          else
            echo "version=new" >> "$GITHUB_OUTPUT"
          fi
      # The product version, the commit's title, how many database migrations the build carries, and the node build:
      # the last commit that changed the node image's files, which needs the whole history checked out above.
      - id: build
        if: ${{ steps.fresh.outputs.version == 'new' }}
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --format=%s | tr -d '\r"')" >> "$GITHUB_OUTPUT"
          echo "migrations=$(ls apps/server/drizzle/*.sql | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          node=$(bash scripts/node-build.sh)
          echo "node=$node" >> "$GITHUB_OUTPUT"
      # Our own builder's machine runs other platforms' programs already.
      - if: ${{ steps.fresh.outputs.version == 'new' && !(github.event.repository.private && vars.BUILDKIT_ENDPOINT) }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.fresh.outputs.version == 'new' }}
        with:
          driver: ${{ github.event.repository.private && vars.BUILDKIT_ENDPOINT && 'remote' || 'docker-container' }}
          endpoint: ${{ github.event.repository.private && vars.BUILDKIT_ENDPOINT || '' }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ steps.fresh.outputs.version == 'new' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ steps.fresh.outputs.version == 'new' }}
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          # The node image goes out through its own output, so the push and the timestamps it rewrites are one export.
          push: ${{ matrix.name != 'hornhoof-node' }}
          # The source label links each package to this repository on GitHub; the rest tell Hornhoof what a build is.
          # The node image carries none of a commit's own labels, timestamps or provenance, so its digest changes only
          # when its own layers change.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            ${{ matrix.name != 'hornhoof-node' && format('org.opencontainers.image.version={0}', steps.build.outputs.version) || '' }}
            ${{ matrix.name != 'hornhoof-node' && format('org.opencontainers.image.revision={0}', github.sha) || '' }}
            ${{ matrix.name != 'hornhoof-node' && format('io.hornhoof.title={0}', steps.build.outputs.title) || '' }}
            ${{ matrix.name != 'hornhoof-node' && format('io.hornhoof.migrations={0}', steps.build.outputs.migrations) || '' }}
          build-args: |
            ${{ matrix.name == 'hornhoof' && format('HORNHOOF_VERSION={0}', steps.build.outputs.version) || '' }}
            ${{ matrix.name == 'hornhoof' && format('HORNHOOF_COMMIT={0}', github.sha) || '' }}
            ${{ matrix.name != 'hornhoof-updater' && format('HORNHOOF_NODE_BUILD={0}', steps.build.outputs.node) || '' }}
            ${{ matrix.name == 'hornhoof-node' && 'SOURCE_DATE_EPOCH=315532800' || '' }}
          outputs: ${{ matrix.name == 'hornhoof-node' && 'type=registry,rewrite-timestamp=true' || '' }}
          provenance: ${{ matrix.name != 'hornhoof-node' }}
          # Every company updates to latest, so this job never moves it: the publish job does, once the tests passed on main.
          tags: ghcr.io/invariant0x/${{ matrix.name }}:${{ github.sha }}
          # The cache beside each image, whatever BuildKit builds it: one drops what it built once its store is full, and
          # a new one starts empty. The registry takes only the layers it lacks; GitHub's own cache took longer than the
          # build to take them all. A cache that cannot be written fails no build.
          cache-from: type=registry,ref=ghcr.io/invariant0x/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/invariant0x/${{ matrix.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  # The one way a build reaches machines. It takes the images this push built for its commit, as they are, by the digests their
  # commit's tag points at: a build made again would have other digests. A commit with no images stops here, the tags stay
  # where they are, and running the images and this job again goes on.
  publish:
    needs: [mark, test, images]
    # Tests the mark left out count as passed here too.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.images.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.mark.outputs.proved == 'true')) }}
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.BUILD_RUNS_ON && fromJSON(vars.BUILD_RUNS_ON) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Every push to main comes here, and most carry no new version: one whose version is out already moves nothing.
      - id: fresh
        name: Look whether this version is out already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2> /dev/null; then
            echo "Version $version is out already, so this commit carries no new version and nothing moves."
            echo "version=out" >> "$GITHUB_OUTPUT"
          else
            echo "version=new" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.fresh.outputs.version == 'new' }}
        with:
          driver: ${{ github.event.repository.private && vars.BUILDKIT_ENDPOINT && 'remote' || 'docker-container' }}
          endpoint: ${{ github.event.repository.private && vars.BUILDKIT_ENDPOINT || '' }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ steps.fresh.outputs.version == 'new' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each image by the digest its commit's tag points at now, so what moves below is exactly that image.
      - id: built
        name: Find the images built for this commit
        if: ${{ steps.fresh.outputs.version == 'new' }}
        run: |
          for part in app:hornhoof node:hornhoof-node updater:hornhoof-updater; do
            image="ghcr.io/invariant0x/${part#*:}:$GITHUB_SHA"
            digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" | jq -r '.digest // empty' || true)
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "There is no $image. Run the images job of this commit again, then this job."
              exit 1
            fi
            echo "${part%%:*}=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Move the version and latest onto exactly those images
        if: ${{ steps.fresh.outputs.version == 'new' }}
        env:
          APP: ${{ steps.built.outputs.app }}
          NODE: ${{ steps.built.outputs.node }}
          UPDATER: ${{ steps.built.outputs.updater }}
        run: |
          version=$(node -p "require('./package.json').version")
          move() { docker buildx imagetools create --tag "ghcr.io/invariant0x/$1:latest" --tag "ghcr.io/invariant0x/$1:$version" "ghcr.io/invariant0x/$1@$2"; }
          # Servers read the app image first, so it moves once what it goes with is there.
          move hornhoof-updater "$UPDATER"
          move hornhoof-node "$NODE"
          move hornhoof "$APP"
      - name: Check that latest holds exactly those images
        if: ${{ steps.fresh.outputs.version == 'new' }}
        env:
          APP: ${{ steps.built.outputs.app }}
          NODE: ${{ steps.built.outputs.node }}
          UPDATER: ${{ steps.built.outputs.updater }}
        run: |
          held() {
            digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "ghcr.io/invariant0x/$1:latest" | jq -r '.digest // empty' || true)
            if [ "$digest" != "$2" ]; then
              echo "ghcr.io/invariant0x/$1:latest holds ${digest:-nothing that could be read}, not $2."
              exit 1
            fi
          }
          held hornhoof-updater "$UPDATER"
          held hornhoof-node "$NODE"
          held hornhoof "$APP"

  release:
    needs: publish
    # Tests skipped further back would skip this job too, so it asks only that the images went out.
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.BUILD_RUNS_ON && fromJSON(vars.BUILD_RUNS_ON) || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create the version tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "$tag already exists; no new release."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Hornhoof $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          # The website's install.sh follows the release (installer-site.yml).
          gh workflow run installer-site.yml --repo "$GITHUB_REPOSITORY" --ref main
