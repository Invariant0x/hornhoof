# A machine that joined the company names this file after compose.yaml in COMPOSE_FILE of its .env. The services that
# keep the data or reach it are in a profile nobody turns on on a worker, so they never start there: front, the keeper
# and the updater are that machine's whole core. A machine that keeps a copy of the company's data turns the profile
# data on, and builtin with it, in COMPOSE_PROFILES of its .env. A server's .env never names this file.
services:
  db:
    profiles: ["data"]
  migrate:
    profiles: ["data"]
  app:
    profiles: ["data"]
  # A machine that keeps a copy runs its own built-in node, which signs in as that machine's and takes the work of the
  # company's keys: its .env names this profile beside data.
  node:
    profiles: ["builtin"]
