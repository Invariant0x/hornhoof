services:
  app:
    build: .
    # install.sh and the updater pin the build in .env as HORNHOOF_VERSION.
    image: ghcr.io/invariant0x/hornhoof:${HORNHOOF_VERSION:-latest}
    restart: unless-stopped
    # install.sh picks a free port for each company's server on one computer and keeps it in .env.
    ports:
      - "${HORNHOOF_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://hornhoof:${POSTGRES_PASSWORD:-hornhoof}@db:5432/hornhoof
      HORNHOOF_SECRET: ${HORNHOOF_SECRET:?Set HORNHOOF_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      NODE_KEY: ${NODE_KEY:?Set NODE_KEY in .env}
    volumes:
      - control:/control
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - internal

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hornhoof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hornhoof}
      POSTGRES_DB: hornhoof
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hornhoof -d hornhoof"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # Runs checks and jobs for the company's API keys. Agents run whatever their prompt asks, so it has no
  # capabilities and cannot reach the database.
  node:
    image: ghcr.io/invariant0x/hornhoof-node:${HORNHOOF_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    command: ["run", "--builtin"]
    restart: unless-stopped
    environment:
      HORNHOOF_SERVER: http://app:8080
      NODE_KEY: ${NODE_KEY:?Set NODE_KEY in .env}
    volumes:
      - nodedata:/data
    # Browsers that agents run for checks need more shared memory than Docker's 64 MB.
    shm_size: 2gb
    # Root inside this container only, to start each company key's jobs as a user of its own.
    # Nothing from the host is mounted and no new privileges can be gained.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    networks:
      - default

  # Moves this server to another build when someone updates from the web app: it saves the database, runs the
  # installer that comes inside that build, and goes back if the new server does not answer. It holds the Docker
  # socket, so it reads nothing from the app but the tag of a Hornhoof image. The server folder is mounted at the
  # same path as on the host, so compose finds the same files from inside.
  updater:
    image: ghcr.io/invariant0x/hornhoof-updater:${HORNHOOF_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
    restart: unless-stopped
    environment:
      HORNHOOF_IMAGE: ghcr.io/invariant0x/hornhoof
      HORNHOOF_SERVER_DIR: ${HORNHOOF_SERVER_DIR:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-hornhoof}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control:/control
      - ${HORNHOOF_SERVER_DIR:-.}:${HORNHOOF_SERVER_DIR:-/srv/hornhoof}
    networks:
      - default

networks:
  internal:
    internal: true

volumes:
  pgdata:
  nodedata:
  control:
