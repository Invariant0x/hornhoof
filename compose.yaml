services:
  # Serves the company's web port and passes every request and socket on to the keeper. It holds nothing yet.
  front:
    build: .
    image: ${HORNHOOF_APP_REF:-ghcr.io/invariant0x/hornhoof:latest}
    command: ["node", "apps/server/dist/front.js"]
    restart: unless-stopped
    # install.sh picks a free port for each company's server on one computer and keeps it in .env. An empty value in
    # .env reads as unset because of the `:-`.
    ports:
      - "${HORNHOOF_PORT:-8080}:8080"
    depends_on:
      - keeper
    networks:
      - default

  # Sets the app's mode, runs the public link's frpc as its child, ends the link's TLS and passes what comes in to the
  # app. It reads the link from the database, and has the control folder and no Docker socket.
  keeper:
    build: .
    image: ${HORNHOOF_APP_REF:-ghcr.io/invariant0x/hornhoof:latest}
    command: ["node", "apps/server/dist/keeper.js"]
    restart: unless-stopped
    # The peer link's port, held from now on; nothing listens on it until the peer link's plan.
    ports:
      - "${HORNHOOF_PEER_PORT:-8180}:7070"
    environment:
      # The same database, secret, certificate directory and relay as the app, since the keeper reads the link with the
      # app's own code.
      DATABASE_URL: postgres://hornhoof:${POSTGRES_PASSWORD:-hornhoof}@db:5432/hornhoof
      # Empty on a machine that keeps none of the company's data, which holds no secret. Where the data is kept, the
      # keeper itself refuses to start without it.
      HORNHOOF_SECRET: ${HORNHOOF_SECRET:-}
      ACME_DIRECTORY: ${ACME_DIRECTORY:-}
      RELAY_URL: ${RELAY_URL:-}
      # The id frpc logs in with, written once by install.sh.
      HORNHOOF_MACHINE_ID: ${HORNHOOF_MACHINE_ID:-}
      # The ports this machine publishes, which the keeper reports to the app; it publishes only the peer port itself.
      HORNHOOF_PORT: ${HORNHOOF_PORT:-8080}
      HORNHOOF_PEER_PORT: ${HORNHOOF_PEER_PORT:-8180}
      # worker on a machine that joined the company and keeps none of its data: there the keeper reaches the company's
      # server, at the address the join command came from, with the ticket the join brought, used once.
      HORNHOOF_ROLE: ${HORNHOOF_ROLE:-data}
      HORNHOOF_JOIN_SERVER: ${HORNHOOF_JOIN_SERVER:-}
      HORNHOOF_JOIN_TICKET: ${HORNHOOF_JOIN_TICKET:-}
      # Where the other machines of the company dial this one on its local network, and the name of its host, as
      # install.sh wrote them down.
      HORNHOOF_ADDRESSES: ${HORNHOOF_ADDRESSES:-}
      HORNHOOF_HOSTNAME: ${HORNHOOF_HOSTNAME:-}
      # The key of the machine's owner, as the join command they ran there carried it. The keeper of a machine that
      # joined pins it, and only what that key signs opens the machine later.
      HORNHOOF_OWNER_KEY: ${HORNHOOF_OWNER_KEY:-}
      # The system of the computer, as install.sh wrote it down: the keeper tells the company, so a machine's card says
      # what open access reaches there.
      HORNHOOF_HOST_OS: ${HORNHOOF_HOST_OS:-}
      # The key of the server's nodes, which the keeper of the machine with the data puts into each backup. Under a name
      # of the keeper's own: a machine without the data has none, and an empty NODE_KEY would stop the keeper.
      HORNHOOF_NODE_KEY: ${NODE_KEY:-}
      # How long a server restored after a total loss waits for a machine of the company to answer, in seconds; 600
      # when empty.
      HORNHOOF_SURVIVOR_S: ${HORNHOOF_SURVIVOR_S:-}
      # Where a machine that takes the server over asks who answers at the company's public name: that name itself when
      # empty. Only a test sets it, to an address that stands in for hornhoof.org.
      HORNHOOF_LINK_PROBE: ${HORNHOOF_LINK_PROBE:-}
      # The folder of the file store's volume.
      FILES_DIR: /files
    volumes:
      - control:/control
      # The machine's own key, which never leaves this volume.
      - keeper:/keeper
      # The updater takes computer requests and access only from this keeper-owned volume.
      - computer:/keeper/computer-control
      # The company's file store, which the keeper shares with the app on a machine with the data and keeps alone on one
      # picked to hold the files.
      - files:/files
    depends_on:
      db:
        condition: service_healthy
        # A machine that keeps no data has no database to wait for.
        required: false
    networks:
      - default
      - internal

  # Runs the database's migrations once, as the owner, before the app starts.
  migrate:
    build: .
    image: ${HORNHOOF_APP_REF:-ghcr.io/invariant0x/hornhoof:latest}
    command: ["node", "apps/server/dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://hornhoof:${POSTGRES_PASSWORD:-hornhoof}@db:5432/hornhoof
      # Where the keeper marks a machine that keeps a copy: its schema comes from the company server, and no migration
      # of its own runs there.
      HORNHOOF_CONTROL_DIR: /control
    volumes:
      - control:/control:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    build: .
    # install.sh names the exact image in .env: by the digest the updater checked, or by the build's tag.
    image: ${HORNHOOF_APP_REF:-ghcr.io/invariant0x/hornhoof:latest}
    restart: unless-stopped
    environment:
      # install.sh puts a random database password into .env; a server set up before that keeps the one its database
      # was made with.
      DATABASE_URL: postgres://hornhoof:${POSTGRES_PASSWORD:-hornhoof}@db:5432/hornhoof
      # Compose fills these in for every service, also on a machine that runs no app and has neither: the app itself
      # refuses to start with one of them empty.
      HORNHOOF_SECRET: ${HORNHOOF_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      NODE_KEY: ${NODE_KEY:-}
      # Where the company's public link comes from.
      RELAY_URL: ${RELAY_URL:-}
      # The one container whose word on https and on the visitor's address the app believes.
      TUNNEL_HOST: keeper
      # The keeper sets the app's mode through the control folder.
      HORNHOOF_KEEPER: "on"
      # Where the link's certificate comes from: Let's Encrypt when empty, off for none.
      ACME_DIRECTORY: ${ACME_DIRECTORY:-}
      # true only on Hornhoof's own installation: it keeps the inbox the feedback of every installation comes to.
      FEEDBACK_INBOX: ${FEEDBACK_INBOX:-}
      # How many megabytes all the files on the company's tasks may take together; 2048 when empty.
      TASK_FILES_MB: ${TASK_FILES_MB:-}
      # What machines share of products' test harnesses: its folder here, and how many MB it may take; 20480 when empty.
      HARNESS_DIR: /harness
      HARNESS_MB: ${HARNESS_MB:-}
      # Where a file over 50 MB lives on this machine, in no copy of the database and no backup: 30 days, and lost if the
      # machine goes.
      FILES_DIR: /files
      # Speech recognition for voice messages that come through the heads' Telegram bots: any service that answers as
      # OpenAI's /v1/audio/transcriptions does, its key and model (whisper-1 when empty). Without it a voice message
      # reaches the agent as its recording alone.
      TRANSCRIBE_URL: ${TRANSCRIBE_URL:-}
      TRANSCRIBE_KEY: ${TRANSCRIBE_KEY:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      # Parts of runs allowed on one physical computer at once; 1 when empty.
      MAX_RUNS_PER_HOST: ${MAX_RUNS_PER_HOST:-}
      # The computer the server and its built-in node run on, as a hash of the key a join from it sends, which install.sh
      # writes, so the pool counts that computer once when it joined as a machine too.
      HORNHOOF_HOST_ID: ${HORNHOOF_HOST_ID:-}
      # The machine this app runs on, which the built-in node names in its key.
      HORNHOOF_MACHINE_ID: ${HORNHOOF_MACHINE_ID:-}
    volumes:
      - control:/control
      # Mask the old computer queue while the app still needs the rest of the control volume.
      - type: tmpfs
        target: /control/computer
        read_only: true
      - harness:/harness
      - files:/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keeper:
        condition: service_started
    networks:
      - default
      - internal

  db:
    # Pinned by digest, so every install runs the database image this build was tested with.
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    # Logical copies of the database need these settings.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10", "-c", "max_prepared_transactions=0"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hornhoof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hornhoof}
      POSTGRES_DB: hornhoof
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hornhoof -d hornhoof"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # Runs checks and jobs for the company's API keys. Agents run whatever their prompt asks, so it has no
  # capabilities and cannot reach the database.
  node:
    image: ${HORNHOOF_NODE_REF:-ghcr.io/invariant0x/hornhoof-node:latest}
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    command: ["run", "--builtin"]
    restart: unless-stopped
    environment:
      # Through front, like every visitor: front holds what the node sends while the app restarts.
      HORNHOOF_SERVER: http://front:8080
      NODE_KEY: ${NODE_KEY:-}
      # The node signs in with a key of this machine, made from NODE_KEY, which itself never travels.
      HORNHOOF_MACHINE_ID: ${HORNHOOF_MACHINE_ID:-}
      # What the computer has, which install.sh writes on a Mac, where Docker runs in a smaller system.
      HORNHOOF_HOST_CPU: ${HORNHOOF_HOST_CPU:-}
      HORNHOOF_HOST_CPUS: ${HORNHOOF_HOST_CPUS:-}
      HORNHOOF_HOST_MEMORY: ${HORNHOOF_HOST_MEMORY:-}
    volumes:
      - nodedata:/data
    # Browsers that agents run for checks need more shared memory than Docker's 64 MB.
    shm_size: 2gb
    # Root inside this container only, to start each company key's jobs as a user of its own.
    # Nothing from the host is mounted and no new privileges can be gained.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # Docker's AppArmor profile on newer Linux, as Debian 13, would stop this root from stopping the programs of its
    # jobs, so the node runs outside it. Docker skips the option where AppArmor is off, as on a Mac.
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    depends_on:
      - front
    networks:
      - default

  # Moves this server to another build when someone updates from the web app: it downloads the build's images, saves
  # the database, runs the installer that comes inside that build, and goes back if the new server does not answer.
  # It holds the Docker socket, so it reads nothing from the app but the tag and the digests of Hornhoof's images.
  # The server folder is mounted at the same path as on the host, so compose finds the same files from inside.
  # While the CEO keeps access to the computer open, it also runs the orchestrator's commands on the computer, as root,
  # in a container of its own image.
  updater:
    image: ${HORNHOOF_UPDATER_REF:-ghcr.io/invariant0x/hornhoof-updater:latest}
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
    restart: unless-stopped
    environment:
      HORNHOOF_IMAGE: ghcr.io/invariant0x/hornhoof
      HORNHOOF_SERVER_DIR: ${HORNHOOF_SERVER_DIR:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-hornhoof}
      HORNHOOF_COMPUTER_IMAGE: ${HORNHOOF_UPDATER_REF:-ghcr.io/invariant0x/hornhoof-updater:latest}
      # worker: it follows the company server's build, and installs it when the keeper passes on the server's word.
      HORNHOOF_ROLE: ${HORNHOOF_ROLE:-data}
      # linux: it reads the machine's own addresses for the keeper, which a container cannot see.
      HORNHOOF_HOST_OS: ${HORNHOOF_HOST_OS:-}
      # Where the build that runs answers with its commit, when that is not the server's own health: a worker's keeper.
      HORNHOOF_HEALTH_URL: ${HORNHOOF_HEALTH_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control:/control
      - computer:/computer
      - ${HORNHOOF_SERVER_DIR:-.}:${HORNHOOF_SERVER_DIR:-/srv/hornhoof}
    networks:
      - default

# Explicit subnets chosen per project by install.sh, outside the computer's own networks and other Docker projects.
networks:
  default:
    ipam:
      config:
        - subnet: ${HORNHOOF_SUBNET:-10.200.0.0/24}
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${HORNHOOF_INTERNAL_SUBNET:-10.200.1.0/24}

volumes:
  pgdata:
  nodedata:
  control:
  computer:
  harness:
  files:
  keeper:
