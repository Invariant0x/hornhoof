services:
  app:
    build: .
    # install.sh names the exact image in .env: by the digest the updater checked, or by the build's tag.
    image: ${HORNHOOF_APP_REF:-ghcr.io/invariant0x/hornhoof:latest}
    restart: unless-stopped
    # install.sh picks a free port for each company's server on one computer and keeps it in .env.
    ports:
      - "${HORNHOOF_PORT:-8080}:8080"
    environment:
      # install.sh puts a random database password into .env; a server set up before that keeps the one its database
      # was made with.
      DATABASE_URL: postgres://hornhoof:${POSTGRES_PASSWORD:-hornhoof}@db:5432/hornhoof
      HORNHOOF_SECRET: ${HORNHOOF_SECRET:?Set HORNHOOF_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      NODE_KEY: ${NODE_KEY:?Set NODE_KEY in .env}
      # Where the company's public link comes from, and the one container whose word that a request came over https
      # the app believes.
      RELAY_URL: ${RELAY_URL:-}
      TUNNEL_HOST: tunnel
      # How many megabytes all the files on the company's tasks may take together; 2048 when empty.
      TASK_FILES_MB: ${TASK_FILES_MB:-}
      # The computer the server and its built-in node run on, as a hash of the key a join from it sends, which install.sh
      # writes, so the pool counts that computer once when it joined as a machine too.
      HORNHOOF_HOST_ID: ${HORNHOOF_HOST_ID:-}
    volumes:
      - control:/control
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - internal

  db:
    # Pinned by digest, so every install runs the database image this build was tested with.
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    restart: unless-stopped
    environment:
      POSTGRES_USER: hornhoof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hornhoof}
      POSTGRES_DB: hornhoof
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hornhoof -d hornhoof"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # Runs checks and jobs for the company's API keys. Agents run whatever their prompt asks, so it has no
  # capabilities and cannot reach the database.
  node:
    image: ${HORNHOOF_NODE_REF:-ghcr.io/invariant0x/hornhoof-node:latest}
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    command: ["run", "--builtin"]
    restart: unless-stopped
    environment:
      HORNHOOF_SERVER: http://app:8080
      NODE_KEY: ${NODE_KEY:?Set NODE_KEY in .env}
      # What the computer has, which install.sh writes on a Mac, where Docker runs in a smaller system.
      HORNHOOF_HOST_CPU: ${HORNHOOF_HOST_CPU:-}
      HORNHOOF_HOST_CPUS: ${HORNHOOF_HOST_CPUS:-}
      HORNHOOF_HOST_MEMORY: ${HORNHOOF_HOST_MEMORY:-}
    volumes:
      - nodedata:/data
    # Browsers that agents run for checks need more shared memory than Docker's 64 MB.
    shm_size: 2gb
    # Root inside this container only, to start each company key's jobs as a user of its own.
    # Nothing from the host is mounted and no new privileges can be gained.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # Docker's AppArmor profile on newer Linux, as Debian 13, would stop this root from stopping the programs of its
    # jobs, so the node runs outside it. Docker skips the option where AppArmor is off, as on a Mac.
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    depends_on:
      - app
    networks:
      - default

  # Carries the company's public link at hornhoof.org to the app. The app writes the link's settings into the control
  # folder; until it does, this waits. It reads nothing else, holds no Docker socket, and runs the app's own image.
  tunnel:
    build: .
    image: ${HORNHOOF_APP_REF:-ghcr.io/invariant0x/hornhoof:latest}
    command: ["node", "apps/server/dist/tunnel.js"]
    restart: unless-stopped
    volumes:
      - control:/control:ro
    depends_on:
      - app
    networks:
      - default

  # Moves this server to another build when someone updates from the web app: it downloads the build's images, saves
  # the database, runs the installer that comes inside that build, and goes back if the new server does not answer.
  # It holds the Docker socket, so it reads nothing from the app but the tag and the digests of Hornhoof's images.
  # The server folder is mounted at the same path as on the host, so compose finds the same files from inside.
  updater:
    image: ${HORNHOOF_UPDATER_REF:-ghcr.io/invariant0x/hornhoof-updater:latest}
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
    restart: unless-stopped
    environment:
      HORNHOOF_IMAGE: ghcr.io/invariant0x/hornhoof
      HORNHOOF_SERVER_DIR: ${HORNHOOF_SERVER_DIR:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-hornhoof}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control:/control
      - ${HORNHOOF_SERVER_DIR:-.}:${HORNHOOF_SERVER_DIR:-/srv/hornhoof}
    networks:
      - default

networks:
  internal:
    internal: true

volumes:
  pgdata:
  nodedata:
  control:
