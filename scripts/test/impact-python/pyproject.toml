[project]
name = "hornhoof-impact-python-checks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
check = [
  "pytest==8.3.5",
  "coverage==7.8.0",
  "black==25.1.0",
  "isort==6.0.1",
  "ruff==0.11.13",
  "mypy==1.15.0",
  "bandit==1.8.3",
]

[tool.setuptools]
py-modules = ["pytest_impact"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
