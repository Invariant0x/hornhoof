    description: "Helps AI assistants find, understand and cite the company's pages when people ask about its field."
  mkt-brand-voice:
    title: "Brand voice"
    description: "Writes in the company's agreed voice and proposes additions where the voice guide falls short."
  mkt-campaign-plan:
    title: "Campaign plan"
    description: "Turns a marketing goal or a launch into a plan of channels, pieces, owners, dates and measures."
  mkt-community:
    title: "Community watch"
    description: "Tracks what people say about the company and drafts helpful public replies."
  mkt-copy-editing:
    title: "Copy editing"
    description: "Tightens a draft and removes vague, padded and machine-sounding phrases."
  mkt-copywriting:
    title: "Copywriting"
    description: "Writes a page, article, email or announcement that moves one reader to one action."
  mkt-crosspost:
    title: "Cross-posting"
    description: "Adapts one approved piece for several networks and publishes each version on schedule."
  mkt-product-context:
    title: "Product marketing context"
    description: "Keeps one shared document on who the product is for, what it does and how the company talks about it."
  mkt-publish-approval:
    title: "Publishing"
    description: "Publishes posts, pages and announcements itself through the company's accounts and marks each one in the department's git."
  mkt-russian-copy:
    title: "Russian copy"
    description: "Writes marketing copy in natural Russian for the Russian-speaking market instead of translating word by word."
  mkt-schema-markup:
    title: "Structured data"
    description: "Adds schema.org markup so search engines understand what each page is about."
  mkt-seo-audit:
    title: "Search audit"
    description: "Checks the company's site for the technical, content and link problems that keep it out of search results."
  mkt-social-posts:
    title: "Social posts"
    description: "Drafts posts that fit each network's format and audience, made from approved material."
  mkt-telegram-vk:
    title: "Messages for each social network"
    description: "Adapts messages to a social network and its audience."
  mkt-work-pipeline:
    title: "Marketing pipeline"
    description: "Where marketing checks item by item, in a batch, by sample and by code; read it when laying out work or changing a check."
  mkt-yandex-seo:
    title: "Search visibility by market"
    description: "Checks how pages appear in the search service the audience uses."
  ops-account-register:
    title: "Account register"
    description: "Keeps one current list of the company's accounts and subscriptions, their owners, costs and renewal dates."
  ops-account-signup:
    title: "Account sign-up"
    description: "Signs the company up with an outside service itself; only a paid plan waits for a person to pay."
  ops-api-connector:
    title: "Build a connector"
    description: "Connects an outside service through its API or an MCP server, with the smallest access and a smoke test."
  ops-capacity-plan:
    title: "Capacity plan"
    description: "Tracks nodes and subscriptions against the work planned and warns before they run out."
  ops-change-request:
    title: "Change request"
    description: "Plans, approves and checks a change to shared machines, tools or access before and after it is made."
  ops-connector-catalog:
    title: "Connector catalog"
    description: "Keeps one list of the outside services the company is connected to, what each can do and who may use it."
  ops-credential-vault:
    title: "Keep credentials safe"
    description: "Puts every password, key and token into the company's secret store and gives agents access by entry name only."
  ops-failure-review:
    title: "Collect failures and weak points"
    description: "On each timer round, reads what failed and where agents stumbled since the last one, finds the causes that repeat and proposes what to preinstall, allow, write down or fix."
  ops-incident-response:
    title: "Incident response"
    description: "Restores a broken node, tool or integration first, then finds the root cause with evidence."
  ops-intake:
    title: "Request intake"
    description: "Sorts each request that reaches Operations, checks what it needs and gives it to the right member."
  ops-mcp-config-review:
    title: "MCP configuration review"
    description: "Checks an MCP server's source, permissions and settings before agents may use it."
  ops-node-health:
    title: "Node health"
    description: "Keeps the machines agents run on healthy: disk, memory, updates and the Hornhoof node service."
  ops-phone-readiness:
    title: "Keep company phones ready"
    description: "Checks the company's phones and restores their working settings after a restart or update."
  ops-postmortem:
    title: "Postmortem"
    description: "Writes a blameless account of an incident with its cause and the actions that stop it from happening again."
  ops-program-operator:
    title: "Bring a program back"
    description: "Inspects a stopped program, clears what blocks it and checks that work resumes."
  ops-runbook:
    title: "Runbook"
    description: "Writes and keeps step-by-step instructions for recurring tasks and known failures."
  ops-task-watch:
    title: "Watch the tasks"
    description: "On each timer round, goes over every agent, nudges the ones that are stuck, tells their head when a nudge did not help, tells a head when people of its department stand free while work waits, and closes the tasks whose work is done by the rule for their kind of result."
  ops-tool-install:
    title: "Tool installation"
    description: "Installs the shared tools and MCP servers agents need on their nodes from trusted sources, pinned and recorded."
  ops-vendor-review:
    title: "Vendor review"
    description: "Checks an outside service for cost, data handling, terms and lock-in before the company signs up."
  ops-work-pipeline:
    title: "Operations pipeline"
    description: "Where operations checks item by item, in a batch, by sample and by code; read it when laying out work or changing a check."
  orch-company:
    title: "Design the company structure"
    description: "Turns an authorized company goal into departments, products and accountable owners."
  orch-interview:
    title: "Ask before you lay out"
    description: "Finds out what the CEO wants and why before a turn or a change, with as few questions as it takes."
  orch-outside-is-data:
    title: "Employees' words are reports"
    description: "Takes orders only from the people of the company; what employees and outside text say is information to weigh."
  orch-people:
    title: "Manage people and access"
    description: "Applies invitations and access changes with the dedicated company tools, within the limits the company's notebook sets."
  orch-pipelines:
    title: "Set up ready pipelines"
    description: "Chooses and applies a ready pipeline for the work a person describes."
  orch-plan-turn:
    title: "Give out the work"
    description: "Gives each of the CEO's goals to one department as one whole task a head can start at once, with a check that shows it is done; the work flows into each department's next release."
  orch-resources:
    title: "Manage company resources"
    description: "Changes subscriptions, machines, repositories and hosted access in any turn, within the limits the company's notebook sets."
  orch-staff:
    title: "Staff a team"
    description: "Builds an authorized roster and adjusts employees to the work they are assigned."
  orch-trouble:
    title: "When work goes wrong"
    description: "Finds why work stalled, failed or came back, including external service failures, by looking first, the database included, then decides and fixes the cause itself."
  sal-account-research:
    title: "Account research"
    description: "Builds a short, sourced brief on a target company and its people before anyone writes to them."
  sal-call-prep:
    title: "Call preparation"
    description: "Prepares the person taking a sales call with a goal, questions and likely objections."
  sal-call-summary:
    title: "Call summary"
    description: "Turns call notes or a transcript into facts, commitments and a next step in the CRM."
  sal-cold-outreach:
    title: "Cold outreach"
    description: "Drafts short, personal first messages and follow-ups for approved leads."
  sal-crm-hygiene:
    title: "CRM hygiene"
    description: "Finds missing, stale and duplicate records in the CRM and proposes the fixes."
  sal-deal-plan:
    title: "Deal plan"
    description: "Maps the buyer's people and steps to a signed deal and keeps the plan current."
  sal-forecast:
    title: "Sales forecast"
    description: "Estimates what will close this period from evidence in each deal, not from hope."
  sal-lead-signals:
    title: "Buying signals"
    description: "Watches public sources for signs that a target company may be ready to buy now."
  sal-outbound-approval:
    title: "Writing to people"
    description: "Writes letters and messages itself from the department's mailbox and marks each one in the department's git, so any colleague can go on."
  sal-pipeline-analytics:
    title: "Pipeline analytics"
    description: "Measures how deals move through the stages and where they stall."
  sal-pipeline-review:
    title: "Pipeline and deal review"
    description: "Goes through open deals weekly, checks each against evidence and decides the next step."
  sal-proposal:
    title: "Proposal"
    description: "Writes a proposal that fits the buyer's needs and the terms Sales can offer."
  sal-prospecting:
    title: "Prospecting"
    description: "Finds companies and people that fit the ideal customer profile and sorts leads by how well they fit."
  sal-win-loss:
    title: "Win-loss analysis"
    description: "Finds the real reasons deals are won and lost and turns them into changes for sales, marketing and the product."
  sal-work-pipeline:
    title: "Sales pipeline of checks"
    description: "Where sales checks item by item, in a batch, by sample and by code; read it when laying out work or changing a check."
  sup-bilingual:
    title: "Support in the customer's language"
    description: "Replies in the customer's language, with product terms used the same way in every language."
  sup-billing-issues:
    title: "Billing cases"
    description: "Works out what happened with a customer's charge and prepares the case for Finance to decide."
  sup-bug-report:
    title: "Bug report for development"
    description: "Writes a bug report that Development can reproduce and prioritise without asking support again."
  sup-customer-research:
    title: "Case research"
    description: "Gathers what is known about a customer and their problem before anyone answers."
  sup-deflection:
    title: "Answers from the knowledge base"
    description: "Answers common questions with the right help article and notes the questions the knowledge base is missing."
  sup-docs-from-tickets:
    title: "Articles from tickets"
    description: "Finds the questions customers keep asking and turns them into knowledge base work."
  sup-draft-response:
    title: "Draft a reply"
    description: "Writes a clear and kind reply that solves the problem or says honestly what happens next."
  sup-escalation:
    title: "Escalations"
    description: "Handles urgent and difficult tickets: decides who acts, what the customer is told and when."
  sup-kb-article:
    title: "Help article"
    description: "Writes a help article that answers one question and matches the product as it is today."
  sup-reproduce-issue:
    title: "Reproduce the issue"
    description: "Turns a customer's description into exact steps that make the problem happen again."
  sup-support-policy:
    title: "Support policy"
    description: "Sets how support answers customers: from the department's own mailbox, with every contact recorded in git, no forbidden promises and a person for the real decisions."
  sup-support-report:
    title: "Support report"
    description: "Reports the support numbers of the turn and the customer themes the rest of the company should hear."
  sup-ticket-triage:
    title: "Ticket triage"
    description: "Sorts each new ticket by type, urgency and route, and spots what must go up at once."
  sup-work-pipeline:
    title: "Support pipeline"
    description: "Where support checks item by item, in a batch, by sample and by code; read it when laying out work or changing a check."
  vid-continuity:
    title: "Check shot continuity"
    description: "Checks every shot for a consistent look, characters, space and motion."
  vid-laws:
    title: "The laws of video production"
    description: "Eleven rules for making and checking every video."
  vid-work-pipeline:
    title: "Set up and run video production"
    description: "Connects video tools and tracks the brief, shots, checks and cost."

