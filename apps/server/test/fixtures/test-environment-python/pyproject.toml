[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-arithmetic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "psycopg[binary]>=3", "coverage>=7"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["totals"]
