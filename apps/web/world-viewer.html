<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Egypt map</title>
    <style>
      :root {
        color-scheme: dark;
        --backdrop: #1a1713;
        --panel: rgba(26, 23, 19, 0.9);
        --line: rgba(235, 214, 170, 0.34);
        --ink: #f3e9d6;
        --muted: #cdbb98;
        --accent: #ffd27a;
        --press: rgba(255, 255, 255, 0.07);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--backdrop);
      }
      body {
        font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .world {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      .bar {
        position: fixed;
        inset-block-end: max(12px, env(safe-area-inset-bottom));
        inset-inline-start: max(12px, env(safe-area-inset-left));
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 6px;
        max-width: calc(100vw - 24px);
        box-sizing: border-box;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .bar button,
      .bar select,
      .overview button {
        min-height: 40px;
        min-width: 40px;
        padding: 0 12px;
        font: inherit;
        color: var(--ink);
        background: var(--press);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      .bar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .bar .zoom {
        min-width: 66px;
        color: var(--accent);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .bar label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding-inline-start: 6px;
        color: var(--muted);
      }
      .bar .hint {
        padding-inline: 6px;
        color: var(--muted);
        font-size: 12.5px;
      }
      :is(button, select):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .overview {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        background: rgba(14, 12, 10, 0.86);
      }
      .overview[hidden],
      .loading[hidden] {
        display: none;
      }
      .overview header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        color: var(--muted);
      }
      .overview .room {
        position: relative;
        margin: 0 16px 16px;
        min-height: 0;
      }
      .overview canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        pointer-events: none;
      }
      .file-note {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 24px;
        max-width: 640px;
        margin: auto;
        color: var(--ink);
        text-align: center;
        -webkit-user-select: text;
        user-select: text;
      }
      .file-note code {
        color: var(--accent);
      }
      @media (max-width: 760px) {
        .bar .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Browsers run no module script from a file: the folder needs a web server. Say so instead of a blank page. -->
    <script>
      if (location.protocol === 'file:') {
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<div class="file-note" data-testid="viewer-file-note">' +
            '<p>Эту страницу нужно открыть через веб-сервер, а не из файла. Например, в этой папке: <code>python3 -m http.server</code>, затем адрес <code>http://localhost:8000/</code>.</p>' +
            '<p lang="en">Open this page from a web server, not from a file. For example, in this folder: <code>python3 -m http.server</code>, then <code>http://localhost:8000/</code>.</p>' +
            '</div>',
        );
      }
    </script>
    <script type="module" src="/src/world-packs/viewer.ts"></script>
  </body>
</html>
