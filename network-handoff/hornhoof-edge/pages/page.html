<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>{{TITLE}}</title>
<style>
@font-face { font-family: 'Tektur'; font-weight: 600; font-display: swap; src: url(data:font/woff2;base64,{{TEKTUR}}) format('woff2'); }
@font-face { font-family: 'Onest'; font-weight: 400; font-display: swap; src: url(data:font/woff2;base64,{{ONEST}}) format('woff2'); }
:root {
  --bg: #141A22; --surface: #1B232D; --line: #2C3845; --line2: #3D4C5C; --ink: #E3EAF1; --muted: #93A0AE;
  --cyan: #46E0EF; --cyan-ink: #6FE9F5; --amber: #FFB54A; --dot: rgba(140,175,205,.15);
  --f-display: 'Tektur', ui-sans-serif, system-ui, sans-serif; --f-body: 'Onest', ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; padding: 24px 16px;
  background-color: var(--bg);
  background-image: radial-gradient(ellipse 60% 45% at 50% 42%, rgba(70,224,239,.07), transparent 70%), radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 100% 100%, 22px 22px;
  color: var(--ink); font: 16px/1.55 var(--f-body);
}
.frame {
  --cut: 16px;
  width: min(var(--w, 460px), 100%); padding: 1px; background: var(--line2); position: relative;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
.panel {
  --cut: 15px;
  background: var(--surface); padding: 34px 32px 26px;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
.corner { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-left: 2px solid var(--cyan); border-top: 2px solid var(--cyan); }
.brand { display: flex; align-items: center; gap: 12px; font: 600 20px/1 var(--f-display); letter-spacing: .01em; }
.brand svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(70,224,239,.45)); }
/* The status code, chamfered like the frame: the outer box is its border. */
.code, .code b { --cut: 6px; clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.code { margin-left: auto; padding: 1px; background: rgba(255,181,74,.5); }
.code b { display: block; padding: 5px 10px 4px; font: 600 13px/1 var(--f-display); color: var(--amber); background: #2B2D2F; }
h1 { margin: 30px 0 10px; font: 600 30px/1.15 var(--f-display); letter-spacing: .005em; }
p { margin: 0; color: var(--muted); max-width: 40ch; }
footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
a { color: var(--cyan-ink); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.mk-dome { fill: none; stroke: var(--cyan); stroke-width: 2.4; stroke-dasharray: 32; animation: draw 1.1s ease-out both; }
.mk-base { stroke: var(--ink); stroke-width: 2.4; }
.mk-dot { fill: var(--ink); animation: light .5s ease-out 1s both; }
@keyframes draw { from { stroke-dashoffset: 32; } }
@keyframes light { from { fill: var(--line2); } 60% { fill: var(--cyan-ink); } }
@media (prefers-reduced-motion: reduce) { .mk-dome, .mk-dot { animation: none; } }
/* The stub: the command that starts a company, to copy into a terminal. */
.frame.wide { --w: 600px; }
.cmd { margin-top: 24px; }
.cmd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.cmd-label { font-size: 14px; color: var(--muted); }
.copy { --cut: 6px; flex: none; padding: 1px; border: 0; background: var(--line2); cursor: pointer; clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.copy span { --cut: 5px; display: block; min-width: 92px; padding: 8px 14px 7px; background: var(--surface); color: var(--ink); font: 600 13px/1 var(--f-display); clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.copy:hover span, .copy.done span { color: var(--cyan-ink); }
.copy:hover, .copy.done { background: var(--cyan); }
.copy:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.cmd code { display: block; padding: 13px 16px; border: 1px solid var(--line2); border-left: 2px solid var(--cyan); background: #10151C; color: var(--cyan-ink); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.small { margin-top: 18px; font-size: 14px; }
@media (max-width: 420px) { .panel { padding: 26px 22px 22px; } h1 { font-size: 26px; } .copy span { padding: 13px 16px 12px; } }
</style>
</head>
<body>
<main class="frame{{WIDE}}">
  <div class="panel">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true"><path class="mk-dome" d="M 5 20 A 10 10 0 0 1 25 20"/><path class="mk-base" d="M 2 24.5 L 28 24.5"/><circle class="mk-dot" cx="15" cy="16" r="2.4"/></svg>
      Hornhoof{{CODE}}
    </div>
    <h1>{{HEAD}}</h1>
    <p>{{TEXT}}</p>{{EXTRA}}
    <footer>{{FOOT}}</footer>
  </div>
  <span class="corner"></span>
</main>
</body>
</html>
